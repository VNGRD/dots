live_config_reload = true
import = [
  "/usr/local/lib/node_modules/alacritty-themes/themes/Monotheme.toml"
]

[env]
TERM = "xterm-256color"

[font]
size = 10

  [font.normal]
  family = "IBM Plex Mono"

[shell]
program = "/bin/bash"

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 25
y = 25
